name: Build Omar AI APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          mkdir project
          unzip -q "omar-ai-fixed (3).zip" -d project

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"

      - name: Find Gradle project
        run: |
          echo "Searching for Gradle project..."
          find project -name gradlew -type f -print

      - name: Build APK
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found in the ZIP project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "Gradle project found at: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Find APK
        run: |
          echo "Searching for APK..."
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Omar-AI-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
